<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Frostbite — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#101010;color:#fff;font-family:monospace;touch-action:none}body{display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;aspect-ratio:4/3;image-rendering:pixelated}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:clamp(130px,36vw,170px);aspect-ratio:1;border:3px solid #ffffff80;border-radius:50%;background:#0009;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#eee;border:3px solid #fff;pointer-events:none}.action{pointer-events:auto;position:absolute;border:2px solid #fff9;color:#fff;font:bold 13px monospace;touch-action:none;user-select:none}.jump{right:max(20px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:clamp(76px,21vw,94px);aspect-ratio:1;border-radius:50%;background:#2255aacc}.enter{right:max(25px,env(safe-area-inset-right));bottom:calc(max(34px,env(safe-area-inset-bottom)) + 105px);width:72px;height:42px;border-radius:9px;background:#28733dcc}.back{left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));height:38px;border-radius:8px;background:#000a;padding:0 12px}@media(pointer:coarse),(max-width:800px){body{align-items:flex-start}canvas{width:min(100vw,calc((100dvh - clamp(165px,40vw,205px))*1.333333));max-height:calc(100dvh - clamp(165px,40vw,205px))}.mobile{display:block}}@media(pointer:coarse) and (orientation:landscape){canvas{height:100dvh;width:auto;max-width:70vw}.joy{width:min(31vh,160px)}.jump{width:min(20vh,92px)}.enter{bottom:auto;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}}</style></head><body><canvas id="game" width="800" height="600"></canvas><div class="mobile"><div class="joy" id="joy"><div class="knob"></div></div><button class="action jump" data-key="Space">PULAR</button><button class="action enter" data-key="Enter">ENTER</button><button class="action back" data-key="Escape">MENU</button></div><script src="game-progress.js"></script><script src="frostbite.js"></script><script>const emit=(k,t)=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));function joystick(el){const knob=el.querySelector('.knob');let pid=null,last=null;const stop=()=>{if(last)emit(last,'keyup');last=null;knob.style.transform='translate(-50%,-50%)'};function move(e){const r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),mag=Math.hypot(dx,dy),max=r.width*.3,s=Math.min(1,max/(mag||1)),x=dx*s,y=dy*s;knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;if(mag<r.width*.10){stop();return}const ax=Math.abs(dx),ay=Math.abs(dy);let k;if(ax>ay*1.25)k=dx<0?'ArrowLeft':'ArrowRight';else if(ay>ax*1.25)k=dy<0?'ArrowUp':'ArrowDown';else k=ax>ay?(dx<0?'ArrowLeft':'ArrowRight'):(dy<0?'ArrowUp':'ArrowDown');if(k!==last){if(last)emit(last,'keyup');last=k;emit(k,'keydown')}}el.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;el.setPointerCapture?.(pid);move(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();move(e)}});['pointerup','pointercancel','lostpointercapture'].forEach(v=>el.addEventListener(v,e=>{if(pid===null||e.pointerId===pid){pid=null;stop()}}))}joystick(document.querySelector('#joy'));document.querySelectorAll('button[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);emit(k,'keydown')});['pointerup','pointercancel'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();emit(k,'keyup')}))});</script></body></html>
