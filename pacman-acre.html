<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pac-Man Retrô — Meu Game Retrô</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100d09;display:grid;place-items:center;font-family:monospace;overflow:hidden}#wrap{width:min(100vw,960px);position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}.pad{display:none;position:absolute;left:14px;bottom:42px;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px;gap:4px}.pad button{border:2px solid #a88e3c;background:#273da6;color:#ead36a;font:bold 20px monospace;opacity:.8}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}@media(pointer:coarse){.pad{display:grid}}
#intro{position:fixed;inset:0;z-index:1000;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .75s ease}
#intro.hide{opacity:0;pointer-events:none}
#introScene{position:absolute;inset:0;background:url('Noite de Jogos Retrô na Sala.png') center/cover no-repeat;transform:scale(1.01);animation:introZoom 6.2s ease-in-out forwards}
#introScene:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(80,150,255,0) 0 10%,rgba(35,100,255,.08) 24%,rgba(0,0,0,.38) 78%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);animation:screenPulse 1.4s steps(2,end) infinite;pointer-events:none}
#introFlash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(130,190,255,.85),rgba(40,90,255,.12) 25%,transparent 55%);opacity:0;animation:powerOn 6.2s ease forwards;pointer-events:none}
#introText{position:absolute;left:0;right:0;bottom:8%;text-align:center;color:#ffe55a;text-shadow:0 0 8px #ff9d00,3px 3px #4b2600;font:bold clamp(16px,2.3vw,30px) monospace;letter-spacing:2px;animation:textBlink .8s steps(2,end) infinite}
#skipIntro{position:absolute;right:20px;top:20px;z-index:3;border:2px solid #ffe55a;background:rgba(0,0,0,.65);color:#ffe55a;padding:10px 15px;font:bold 14px monospace;cursor:pointer}
@keyframes introZoom{0%,42%{transform:scale(1.01)}70%{transform:scale(1.08)}100%{transform:scale(1.55);transform-origin:50% 42%}}
@keyframes powerOn{0%,30%{opacity:0}34%{opacity:.9}37%{opacity:.08}42%{opacity:.65}62%{opacity:.2}82%{opacity:.75}100%{opacity:1}}
@keyframes screenPulse{50%{filter:brightness(1.12)}}
@keyframes textBlink{50%{opacity:.35}}
</style>
</head>
<body>
<div id="intro" aria-label="Introdução do Pac-Man ACRE">
  <div id="introScene"></div><div id="introFlash"></div>
  <div id="introText">PRESSIONE START — A AVENTURA VAI COMEÇAR!</div>
  <button id="skipIntro" type="button">PULAR INTRO ▶</button>
</div>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas><div class="pad"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div></div>
<script src="game-progress.js"></script><script src="pacman-acre.js"></script>
<script>
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();dispatchEvent(new KeyboardEvent('keydown',{code:b.dataset.k,key:b.dataset.k,bubbles:true}))}));
const intro=document.getElementById('intro');let introDone=false;
function finishIntro(){if(introDone)return;introDone=true;intro.classList.add('hide');setTimeout(()=>intro.remove(),800);document.getElementById('game').focus();}
document.getElementById('skipIntro').addEventListener('click',finishIntro);
setTimeout(finishIntro,6200);
</script>
</body></html>
