<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pac-Man Retrô — Meu Game Retrô</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100d09;display:grid;place-items:center;font-family:monospace;overflow:hidden}#wrap{width:min(100vw,960px);position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}.pad{display:none;position:absolute;left:14px;bottom:42px;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px;gap:4px}.pad button{border:2px solid #a88e3c;background:#273da6;color:#ead36a;font:bold 20px monospace;opacity:.8}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}@media(pointer:coarse){.pad{display:grid}}</style></head><body><div id="wrap"><canvas id="game" width="960" height="540"></canvas><div class="pad"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div></div><script src="pacman-acre.js"></script><script>document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();dispatchEvent(new KeyboardEvent('keydown',{code:b.dataset.k,key:b.dataset.k,bubbles:true}))}));</script></body></html>
