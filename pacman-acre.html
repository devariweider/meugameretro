<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pac-Man Retrô — Meu Game Retrô</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100d09;display:grid;place-items:center;font-family:monospace;overflow:hidden}#wrap{width:min(100vw,960px);position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}.pad{display:none;position:absolute;left:14px;bottom:42px;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px;gap:4px}.pad button{border:2px solid #a88e3c;background:#273da6;color:#ead36a;font:bold 20px monospace;opacity:.8}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}@media(pointer:coarse){.pad{display:grid}}
#intro{position:fixed;inset:0;z-index:1000;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}#intro.hide{opacity:0;pointer-events:none}#introVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}#fallback{position:absolute;inset:0;background:url('Noite de Jogos Retrô na Sala.png') center/cover no-repeat;z-index:-1}#skipIntro{position:absolute;right:20px;top:20px;z-index:3;border:2px solid #ffe55a;background:rgba(0,0,0,.65);color:#ffe55a;padding:10px 15px;font:bold 14px monospace;cursor:pointer;text-shadow:0 0 6px #ff9d00}
</style>
</head><body>
<div id="intro" aria-label="Introdução do Pac-Man ACRE"><div id="fallback"></div><video id="introVideo" autoplay muted playsinline preload="auto"><source src="video-game-retro-intro.webm" type="video/webm"></video><button id="skipIntro" type="button">PULAR INTRO ▶</button></div>
<div id="wrap"><canvas id="game" width="960" height="540" tabindex="0"></canvas><div class="pad"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div></div>
<script src="game-progress.js"></script><script src="pacman-acre.js"></script><script>
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();dispatchEvent(new KeyboardEvent('keydown',{code:b.dataset.k,key:b.dataset.k,bubbles:true}))}));
const intro=document.getElementById('intro'),video=document.getElementById('introVideo');let introDone=false;
function finishIntro(){if(introDone)return;introDone=true;intro.classList.add('hide');setTimeout(()=>intro.remove(),500);document.getElementById('game').focus();}
document.getElementById('skipIntro').addEventListener('click',finishIntro);video.addEventListener('ended',finishIntro);video.addEventListener('error',()=>setTimeout(finishIntro,6200));setTimeout(()=>{if(!introDone&&video.paused)video.play().catch(()=>{})},250);
</script></body></html>
