<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pac-Man Retrô — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#100d09;font-family:monospace;overflow:hidden;touch-action:none}body{display:grid;place-items:center}#wrap{width:min(100vw,960px);position:relative}canvas{display:block;width:100%;height:auto;max-height:100vh;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}.pad{display:none;position:fixed;inset:0;pointer-events:none}.pad button{pointer-events:auto;position:absolute;width:62px;height:62px;border:2px solid #a88e3c;background:#17266dcc;color:#ead36a;border-radius:14px;font:bold 22px monospace;touch-action:none;user-select:none}.pad .up{left:82px;bottom:102px}.pad .left{left:18px;bottom:38px}.pad .down{left:82px;bottom:38px}.pad .right{left:146px;bottom:38px}.pad .back{left:12px;top:max(12px,env(safe-area-inset-top));bottom:auto;width:auto;height:40px;padding:0 12px;font-size:12px}@media(pointer:coarse),(max-width:700px){body{align-items:start}#wrap{width:100vw}canvas{width:100vw;max-height:70vh}.pad{display:block}}</style></head><body><div id="wrap"><canvas id="game" width="960" height="540" tabindex="0"></canvas></div><div class="pad"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button><button class="back" data-k="Escape">MENU</button></div><script src="game-progress.js"></script><script src="pacman-acre.js"></script><script>document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k,send=t=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);send('keydown')});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();send('keyup')}))});document.getElementById('game').focus();</script></body></html>
