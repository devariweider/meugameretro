<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pac-Man Retrô — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;background:#100d09;font-family:monospace;overflow:hidden;touch-action:none}body{display:flex;align-items:center;justify-content:center}#wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}canvas{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;aspect-ratio:16/9;image-rendering:pixelated}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:clamp(120px,35vw,160px);aspect-ratio:1;border:3px solid #a88e3caa;border-radius:50%;background:#10194bcc;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#ead36a;border:3px solid #fff3a0;pointer-events:none}.action{pointer-events:auto;position:absolute;border:2px solid #a88e3c;background:#10194bcc;color:#ead36a;font:bold 12px monospace;touch-action:none}.back{left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));height:38px;border-radius:8px;padding:0 12px}.enter{right:max(22px,env(safe-area-inset-right));bottom:max(48px,env(safe-area-inset-bottom));width:82px;height:52px;border-radius:12px;background:#276b3dcc;color:#fff}@media(pointer:coarse),(max-width:800px){body{align-items:flex-start}#wrap{height:auto}canvas{width:100vw;height:auto;max-height:calc(100dvh - clamp(155px,39vw,195px))}.mobile{display:block}}@media(pointer:coarse) and (orientation:landscape){#wrap{height:100dvh}canvas{max-width:70vw;max-height:100dvh}.joy{width:min(29vh,150px)}.enter{bottom:50%;translate:0 50%}}</style></head><body><div id="wrap"><canvas id="game" width="960" height="540" tabindex="0"></canvas></div><div class="mobile"><div class="joy" id="joy"><div class="knob"></div></div><button class="action enter" data-key="Enter">ENTER</button><button class="action back" data-key="Escape">MENU</button></div><script src="game-progress.js"></script><script src="pacman-acre.js"></script><script>const emit=(k,t)=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));function joystick(el){const knob=el.querySelector('.knob');let active=null,current=null;function release(){if(current)emit(current,'keyup');current=null;knob.style.transform='translate(-50%,-50%)'}function move(e){const r=el.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.29,d=Math.hypot(dx,dy)||1,s=Math.min(1,max/d),x=dx*s,y=dy*s;knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;if(Math.hypot(dx,dy)<r.width*.11){release();return}const k=Math.abs(dx)>Math.abs(dy)?(dx<0?'ArrowLeft':'ArrowRight'):(dy<0?'ArrowUp':'ArrowDown');if(k!==current){if(current)emit(current,'keyup');current=k;emit(k,'keydown')}}el.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;el.setPointerCapture?.(active);move(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});['pointerup','pointercancel','lostpointercapture'].forEach(v=>el.addEventListener(v,e=>{if(active===null||e.pointerId===active){active=null;release()}}))}joystick(document.querySelector('#joy'));document.querySelectorAll('button[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();emit(k,'keydown')});b.addEventListener('pointerup',e=>{e.preventDefault();emit(k,'keyup')})});document.getElementById('game').focus();</script></body></html>
