<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pac-Man Retrô — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;background:#100d09;font-family:monospace;overflow:hidden;touch-action:none}body{display:flex;align-items:center;justify-content:center}#wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}canvas{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:clamp(118px,34vw,158px);aspect-ratio:1;border:3px solid #a88e3caa;border-radius:50%;background:#10194bcc;touch-action:none;box-shadow:0 0 18px #000}.knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#ead36a;border:3px solid #fff3a0;box-shadow:0 3px 10px #000b;pointer-events:none}.back{pointer-events:auto;position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));height:38px;border:2px solid #a88e3c;border-radius:8px;background:#10194bcc;color:#ead36a;padding:0 12px;font:bold 11px monospace;touch-action:none}@media(pointer:coarse),(max-width:800px){body{align-items:flex-start}#wrap{height:auto}canvas{width:100vw;height:auto;max-height:calc(100dvh - clamp(145px,38vw,185px))}.mobile{display:block}}@media(pointer:coarse) and (orientation:landscape){#wrap{height:100dvh}canvas{max-width:76vw;max-height:100dvh;width:auto;height:auto}.joy{left:auto;right:max(18px,env(safe-area-inset-right));transform:none;bottom:50%;translate:0 50%;width:min(29vh,150px)}}</style></head><body><div id="wrap"><canvas id="game" width="960" height="540" tabindex="0"></canvas></div><div class="mobile"><div class="joy" id="joy"><div class="knob"></div></div><button class="back">MENU</button></div><script src="game-progress.js"></script><script src="pacman-acre.js"></script><script>const emit=(k,t)=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));function joystick(el){const knob=el.querySelector('.knob');let active=null,current=null;function release(){if(current)emit(current,'keyup');current=null;knob.style.transform='translate(-50%,-50%)'}function move(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.29,d=Math.hypot(dx,dy)||1,s=Math.min(1,max/d),x=dx*s,y=dy*s;knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;if(Math.hypot(dx,dy)<r.width*.12){if(current){emit(current,'keyup');current=null}return}const k=Math.abs(dx)>Math.abs(dy)?(dx<0?'ArrowLeft':'ArrowRight'):(dy<0?'ArrowUp':'ArrowDown');if(k!==current){if(current)emit(current,'keyup');current=k;emit(k,'keydown')}}el.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;el.setPointerCapture?.(active);move(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});['pointerup','pointercancel'].forEach(v=>el.addEventListener(v,e=>{if(e.pointerId===active){active=null;release()}}))}joystick(document.querySelector('#joy'));document.querySelector('.back').addEventListener('pointerdown',e=>{e.preventDefault();emit('Escape','keydown')});document.getElementById('game').focus();</script></body></html>
