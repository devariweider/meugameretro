<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>River Raid — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#111;color:#fff;font-family:monospace;touch-action:none}body{display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;aspect-ratio:4/3;image-rendering:pixelated;background:#3c4ab8}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:clamp(118px,34vw,160px);aspect-ratio:1;border:3px solid #ffffff70;border-radius:50%;background:#0008;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#ddd;border:3px solid #fff;pointer-events:none}.action{pointer-events:auto;position:absolute;border:2px solid #fff8;color:#fff;font:bold 13px monospace;touch-action:none}.fire{right:max(24px,env(safe-area-inset-right));bottom:max(38px,env(safe-area-inset-bottom));width:clamp(76px,22vw,96px);aspect-ratio:1;border-radius:50%;background:#b21d1dcc}.enter{right:max(28px,env(safe-area-inset-right));bottom:calc(max(38px,env(safe-area-inset-bottom)) + 110px);width:70px;height:42px;border-radius:9px;background:#28733dcc}.back{left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));height:38px;border-radius:8px;background:#000a;padding:0 12px}@media(pointer:coarse),(max-width:800px){body{align-items:flex-start}canvas{width:min(100vw,calc((100dvh - clamp(160px,39vw,200px))*1.333333));max-height:calc(100dvh - clamp(160px,39vw,200px))}.mobile{display:block}}@media (orientation:landscape) and (pointer:coarse),(orientation:landscape) and (max-height:600px){body{align-items:center}canvas{height:100dvh;width:auto;max-height:100dvh;max-width:100vw}.mobile{display:block}.joy{left:max(8px,env(safe-area-inset-left));bottom:50%;transform:translateY(50%);width:clamp(92px,25vh,145px);background:#0006}.fire{right:max(10px,env(safe-area-inset-right));bottom:50%;transform:translateY(50%);width:clamp(68px,18vh,92px)}.enter{right:max(14px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));bottom:auto;width:64px;height:36px;font-size:11px}.back{left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));height:34px;font-size:10px}}</style></head><body><canvas id="game" width="800" height="600"></canvas><div class="mobile"><div class="joy" id="joy"><div class="knob"></div></div><button class="action fire" data-key="Space">TIRO</button><button class="action enter" data-key="Enter">ENTER</button><button class="action back" data-key="Escape">MENU</button></div><script src="game-progress.js"></script><script src="river-raid.js"></script><script src="river-sprites.js"></script><script>const emit=(k,t)=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));function joystick(el){const knob=el.querySelector('.knob');let active=null,current=null;function release(){if(current)emit(current,'keyup');current=null;knob.style.transform='translate(-50%,-50%)'}function move(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.29,d=Math.hypot(dx,dy)||1,s=Math.min(1,max/d),x=dx*s,y=dy*s;knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;if(Math.hypot(dx,dy)<r.width*.11){release();return}const k=Math.abs(dx)>Math.abs(dy)?(dx<0?'ArrowLeft':'ArrowRight'):(dy<0?'ArrowUp':'ArrowDown');if(k!==current){if(current)emit(current,'keyup');current=k;emit(k,'keydown')}}el.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;el.setPointerCapture?.(active);move(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});['pointerup','pointercancel','lostpointercapture'].forEach(v=>el.addEventListener(v,e=>{if(active===null||e.pointerId===active){active=null;release()}}))}joystick(document.querySelector('#joy'));document.querySelectorAll('button[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();emit(k,'keydown')});b.addEventListener('pointerup',e=>{e.preventDefault();emit(k,'keyup')})});</script></body></html>
