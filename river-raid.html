<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>River Raid — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:white;font-family:monospace;touch-action:none}body{display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 1.333333));height:auto;max-height:100vh;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;background:#3c4ab8}.tip{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);font-size:12px;background:#000b;padding:6px 10px;white-space:nowrap}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.mobile button{pointer-events:auto;position:absolute;width:64px;height:64px;border:2px solid #fff8;border-radius:50%;background:#0009;color:#fff;font:bold 25px monospace;touch-action:none;user-select:none}.left{left:18px;bottom:28px}.right{left:94px;bottom:28px}.up{right:94px;bottom:68px}.down{right:18px;bottom:68px}.fire{right:55px;bottom:145px;background:#b21d1dcc!important;font-size:15px!important}.back{left:12px;top:max(12px,env(safe-area-inset-top));width:auto!important;height:40px!important;border-radius:8px!important;padding:0 12px;font-size:12px!important}@media(pointer:coarse),(max-width:700px){body{align-items:start}canvas{width:100vw;max-height:72vh}.mobile{display:block}.tip{display:none}}</style></head><body><canvas id="game" width="800" height="600"></canvas><div class="tip">← → pilotar · ↑ acelerar · ↓ reduzir · ESPAÇO atirar · ESC voltar</div><div class="mobile"><button class="left" data-key="ArrowLeft">◀</button><button class="right" data-key="ArrowRight">▶</button><button class="up" data-key="ArrowUp">▲</button><button class="down" data-key="ArrowDown">▼</button><button class="fire" data-key="Space">TIRO</button><button class="back" data-key="Escape">MENU</button></div><script src="game-progress.js"></script><script src="river-raid.js"></script><script src="river-sprites.js"></script><script>document.querySelectorAll('.mobile button').forEach(b=>{const k=b.dataset.key,send=t=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);send('keydown')});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();send('keyup')}))});</script></body></html>
