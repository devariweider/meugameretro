<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Game Retrô — ACRE</title><link rel="stylesheet" href="style.css"><style>#siteIntro{position:fixed;inset:0;z-index:9999;background:#000;overflow:hidden;transition:opacity .55s ease}#siteIntro.hide{opacity:0;pointer-events:none}#siteIntro video{width:100%;height:100%;object-fit:cover;display:block;background:#000}#skipIntro{position:absolute;right:20px;top:20px;z-index:2;border:2px solid #ffe55a;background:rgba(0,0,0,.68);color:#ffe55a;padding:10px 15px;font:bold 14px monospace;cursor:pointer;text-shadow:0 0 6px #ff9d00}</style></head><body><div id="siteIntro"><video id="siteIntroVideo" autoplay muted playsinline preload="auto"><source src="video-game-retro-intro.webm" type="video/webm"></video><button id="skipIntro" type="button">PULAR INTRO ▶</button></div><main id="app"><img class="room" src="Noite%20de%20Jogos%20Retr%C3%B4%20na%20Sala.png" alt="Garoto sentado no sofá jogando videogame em uma TV de tubo"><div class="shade"></div><div id="powerFx" class="powerFx"><div class="tvOff"></div><div class="powerDot"></div><div class="bootLine"></div><div class="bootGlow"></div><div class="bootText">MEU GAME RETRÔ<br><small>CARREGANDO AVENTURA...</small></div></div><section id="hud" class="hidden" aria-live="polite"><div class="panel"><p class="eyebrow">MEU GAME RETRÔ</p><h1>ESCOLHA SEU JOGO</h1><div class="games"><button data-game="river"><span>01</span> RIVER RAID <b class="done">✓ COMPLETO</b></button><button data-game="frost"><span>02</span> FROSTBITE <b class="done">✓ COMPLETO</b></button><button data-game="frog"><span>03</span> FROGGER <b class="done">✓ COMPLETO</b></button><button data-game="acre"><span>04</span> PAC-MAN <b class="done">✓ COMPLETO</b></button></div><p class="help">↑ ↓ SELECIONAR • ENTER JOGAR • ESC VOLTAR</p></div></section><button id="start" aria-label="Ligar videogame">LIGAR VIDEOGAME</button><div id="congrats" class="congrats hidden" role="dialog" aria-modal="true"><div class="congratsBox"><span class="trophy">★</span><h2>PARABÉNS!</h2><p>VOCÊ COMPLETOU COM SUCESSO<br><strong>OS 4 JOGOS!</strong></p><span class="congratsText">Obrigado por jogar o Meu Game Retrô!</span><button id="closeCongrats">CONTINUAR</button></div></div></main><script>const siteIntro=document.querySelector('#siteIntro'),siteIntroVideo=document.querySelector('#siteIntroVideo');let siteIntroDone=false;function finishSiteIntro(){if(siteIntroDone)return;siteIntroDone=true;siteIntro.classList.add('hide');setTimeout(()=>siteIntro.remove(),600)}document.querySelector('#skipIntro').addEventListener('click',finishSiteIntro);siteIntroVideo.addEventListener('ended',finishSiteIntro);siteIntroVideo.addEventListener('error',finishSiteIntro);setTimeout(()=>{if(!siteIntroDone&&siteIntroVideo.paused)siteIntroVideo.play().catch(finishSiteIntro)},250);const start=document.querySelector('#start'),hud=document.querySelector('#hud'),buttons=[...document.querySelectorAll('.games button')],congrats=document.querySelector('#congrats'),closeCongrats=document.querySelector('#closeCongrats'),powerFx=document.querySelector('#powerFx');let selected=0,booting=false,audio=null;const routes={river:'river-raid.html',frost:'frostbite.html',frog:'frogger.html',acre:'pacman-acre.html'},doneKeys={river:'retroDoneRiver',frost:'retroDoneFrost',frog:'retroDoneFrog',acre:'retroDonePac'};function tone(f,d=.08,v=.035){try{audio=audio||new(AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),a=audio.createGain();o.type='square';o.frequency.value=f;a.gain.value=v;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}function isDone(k){return localStorage.getItem(doneKeys[k])==='1'}function paintProgress(){buttons.forEach(b=>b.classList.toggle('completed',isDone(b.dataset.game)))}function resetCompleted(){Object.values(doneKeys).forEach(k=>localStorage.removeItem(k));localStorage.removeItem('retroCompleted');sessionStorage.removeItem('retroCongratsShown');paintProgress()}function sel(i){selected=(i+buttons.length)%buttons.length;buttons.forEach((b,n)=>b.classList.toggle('active',n===selected));buttons[selected].focus()}function menu(){start.classList.add('hidden');hud.classList.remove('hidden');paintProgress();sel(0)}function powerOn(){if(booting)return;booting=true;start.classList.add('hidden');powerFx.classList.add('boot');tone(110,.12,.05);setTimeout(()=>tone(220,.08,.035),520);setTimeout(()=>tone(440,.08,.03),900);setTimeout(()=>tone(660,.12,.025),1280);setTimeout(()=>{powerFx.classList.add('finished');menu();booting=false},2200)}function launch(){location.href=routes[buttons[selected].dataset.game]}function celebrate(){paintProgress();if(Object.keys(doneKeys).every(isDone)&&!sessionStorage.getItem('retroCongratsShown')){sessionStorage.setItem('retroCongratsShown','1');powerFx.classList.add('finished');start.classList.add('hidden');hud.classList.remove('hidden');congrats.classList.remove('hidden');closeCongrats.focus()}}closeCongrats.addEventListener('click',()=>{congrats.classList.add('hidden');resetCompleted();sel(0)});start.addEventListener('click',powerOn);buttons.forEach((b,i)=>b.addEventListener('click',()=>{selected=i;launch()}));addEventListener('keydown',e=>{if(!siteIntroDone){if(e.key==='Escape'){e.preventDefault();finishSiteIntro()}return}if(!congrats.classList.contains('hidden')){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();closeCongrats.click()}return}if(!start.classList.contains('hidden')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();powerOn();return}if(hud.classList.contains('hidden'))return;if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();sel(selected+1)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();sel(selected-1)}if(e.key==='Enter'){e.preventDefault();launch()}if(e.key==='Escape'){hud.classList.add('hidden');start.classList.remove('hidden');powerFx.classList.remove('boot','finished')}});paintProgress();celebrate();</script></body></html>
