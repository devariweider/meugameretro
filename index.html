<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Game Retrô — ACRE</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><img class="room" src="Noite%20de%20Jogos%20Retr%C3%B4%20na%20Sala.png" alt="Garoto sentado no sofá jogando videogame em uma TV de tubo"><div class="shade"></div><section id="hud" class="hidden" aria-live="polite"><div class="panel"><p class="eyebrow">MEU GAME RETRÔ</p><h1>ESCOLHA SEU JOGO</h1><div class="games"><button data-game="river"><span>01</span> RIVER RAID <b class="done">✓ COMPLETO</b></button><button data-game="frost"><span>02</span> FROSTBITE <b class="done">✓ COMPLETO</b></button><button data-game="frog"><span>03</span> FROGGER <b class="done">✓ COMPLETO</b></button><button data-game="acre"><span>04</span> PAC-MAN <b class="done">✓ COMPLETO</b></button></div><p class="help">↑ ↓ SELECIONAR • ENTER JOGAR • ESC VOLTAR</p></div></section><button id="start" aria-label="Ligar videogame">LIGAR VIDEOGAME</button><div id="congrats" class="congrats hidden" role="dialog" aria-modal="true"><div class="congratsBox"><span class="trophy">★</span><h2>PARABÉNS!</h2><p>VOCÊ COMPLETOU COM SUCESSO<br><strong>OS 4 JOGOS!</strong></p><span class="congratsText">Obrigado por jogar o Meu Game Retrô!</span><button id="closeCongrats">CONTINUAR</button></div></div></main><script>const start=document.querySelector('#start'),hud=document.querySelector('#hud'),buttons=[...document.querySelectorAll('.games button')],congrats=document.querySelector('#congrats'),closeCongrats=document.querySelector('#closeCongrats');let selected=0;const routes={river:'river-raid.html',frost:'frostbite.html',frog:'frogger.html',acre:'pacman-acre.html'},doneKeys={river:'retroDoneRiver',frost:'retroDoneFrost',frog:'retroDoneFrog',acre:'retroDonePac'};function isDone(k){return localStorage.getItem(doneKeys[k])==='1'}function paintProgress(){buttons.forEach(b=>b.classList.toggle('completed',isDone(b.dataset.game)))}function resetCompleted(){Object.values(doneKeys).forEach(k=>localStorage.removeItem(k));localStorage.removeItem('retroCompleted');sessionStorage.removeItem('retroCongratsShown');paintProgress()}function sel(i){selected=(i+buttons.length)%buttons.length;buttons.forEach((b,n)=>b.classList.toggle('active',n===selected));buttons[selected].focus()}function menu(){start.classList.add('hidden');hud.classList.remove('hidden');paintProgress();sel(0)}function launch(){location.href=routes[buttons[selected].dataset.game]}function celebrate(){paintProgress();if(Object.keys(doneKeys).every(isDone)&&!sessionStorage.getItem('retroCongratsShown')){sessionStorage.setItem('retroCongratsShown','1');start.classList.add('hidden');hud.classList.remove('hidden');congrats.classList.remove('hidden');closeCongrats.focus()}}closeCongrats.addEventListener('click',()=>{congrats.classList.add('hidden');resetCompleted();sel(0)});start.addEventListener('click',menu);buttons.forEach((b,i)=>b.addEventListener('click',()=>{selected=i;launch()}));addEventListener('keydown',e=>{if(!congrats.classList.contains('hidden')){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();closeCongrats.click()}return}if(!start.classList.contains('hidden')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();menu();return}if(hud.classList.contains('hidden'))return;if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();sel(selected+1)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();sel(selected-1)}if(e.key==='Enter'){e.preventDefault();launch()}if(e.key==='Escape'){hud.classList.add('hidden');start.classList.remove('hidden')}});paintProgress();celebrate();</script></body></html>
