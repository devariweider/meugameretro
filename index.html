<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Meu Game Retrô — ACRE</title><link rel="stylesheet" href="style.css"/></head><body><main id="app"><canvas id="scene" width="1280" height="720" aria-label="Sala retrô com jovem no sofá olhando para uma TV"></canvas><section id="hud" class="hidden" aria-live="polite"><div class="panel"><p class="eyebrow">MEU GAME RETRÔ</p><h1>ESCOLHA SEU CARTUCHO</h1><div class="games"><button data-game="river"><span>01</span> RIVER RAID</button><button data-game="frost"><span>02</span> FROSTBITE</button><button data-game="frog"><span>03</span> FROGGER</button><button data-game="acre"><span>04</span> PAC-MAN</button></div><p class="help">↑ ↓ SELECIONAR &nbsp;•&nbsp; ENTER JOGAR &nbsp;•&nbsp; ESC VOLTAR</p></div></section><section id="coming" class="hidden"><div class="panel small"><p class="eyebrow">CARTUCHO INSERIDO</p><h2 id="game-title"></h2><p>Preparando o jogo...</p><button id="back">VOLTAR À SALA</button></div></section><button id="start" aria-label="Ligar videogame">LIGAR VIDEOGAME</button></main><script src="game.js"></script><script>document.addEventListener('click',e=>{const r=e.target.closest('[data-game="river"]'),f=e.target.closest('[data-game="frost"]'),fr=e.target.closest('[data-game="frog"]');if(r){e.stopImmediatePropagation();location.href='river-raid.html'}if(f){e.stopImmediatePropagation();location.href='frostbite.html'}if(fr){e.stopImmediatePropagation();location.href='frogger.html'}},true);document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.dataset?.game==='frog'){e.preventDefault();e.stopImmediatePropagation();location.href='frogger.html'}},true);</script></body></html>
