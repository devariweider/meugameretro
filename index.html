<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Game Retrô — ACRE</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><img class="room" src="Noite%20de%20Jogos%20Retr%C3%B4%20na%20Sala.png" alt="Garoto sentado no sofá jogando videogame em uma TV de tubo"><div class="shade"></div><section id="hud" class="hidden" aria-live="polite"><div class="panel"><p class="eyebrow">MEU GAME RETRÔ</p><h1>ESCOLHA SEU JOGO</h1><div class="games"><button data-game="river"><span>01</span> RIVER RAID</button><button data-game="frost"><span>02</span> FROSTBITE</button><button data-game="frog"><span>03</span> FROGGER</button><button data-game="acre"><span>04</span> PAC-MAN</button></div><p class="help">↑ ↓ SELECIONAR • ENTER JOGAR • ESC VOLTAR</p></div></section><button id="start" aria-label="Ligar videogame">LIGAR VIDEOGAME</button></main><script>const start=document.querySelector('#start'),hud=document.querySelector('#hud'),buttons=[...document.querySelectorAll('.games button')];let selected=0;const routes={river:'river-raid.html',frost:'frostbite.html',frog:'frogger.html',acre:'pacman-acre.html'};function sel(i){selected=(i+buttons.length)%buttons.length;buttons.forEach((b,n)=>b.classList.toggle('active',n===selected));buttons[selected].focus()}function menu(){start.classList.add('hidden');hud.classList.remove('hidden');sel(0)}function launch(){location.href=routes[buttons[selected].dataset.game]}start.addEventListener('click',menu);buttons.forEach((b,i)=>b.addEventListener('click',()=>{selected=i;launch()}));addEventListener('keydown',e=>{if(!start.classList.contains('hidden')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();menu();return}if(hud.classList.contains('hidden'))return;if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();sel(selected+1)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();sel(selected-1)}if(e.key==='Enter'){e.preventDefault();launch()}if(e.key==='Escape'){hud.classList.add('hidden');start.classList.remove('hidden')}});</script></body></html>
