<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Frogger — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#050505;font-family:monospace;touch-action:none}body{display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;aspect-ratio:4/3;image-rendering:pixelated;border:4px solid #222}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:clamp(132px,37vw,172px);aspect-ratio:1;border:3px solid #ffffff80;border-radius:50%;background:#0009;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#eee;border:3px solid #fff;pointer-events:none}.action{pointer-events:auto;position:absolute;border:2px solid #fff9;color:#fff;font:bold 12px monospace;touch-action:none;user-select:none}.enter{right:max(22px,env(safe-area-inset-right));bottom:max(48px,env(safe-area-inset-bottom));width:82px;height:54px;border-radius:12px;background:#28733dcc}.back{left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));height:38px;border-radius:8px;background:#000a;padding:0 12px}@media(pointer:coarse),(max-width:800px){body{align-items:flex-start}canvas{width:min(100vw,calc((100dvh - clamp(165px,41vw,205px))*1.333333));max-height:calc(100dvh - clamp(165px,41vw,205px));border-width:2px}.mobile{display:block}}@media(pointer:coarse) and (orientation:landscape){canvas{height:100dvh;width:auto;max-width:70vw}.joy{width:min(31vh,160px)}.enter{bottom:50%;translate:0 50%}}</style></head><body><canvas id="game" width="800" height="600"></canvas><div class="mobile"><div class="joy" id="joy"><div class="knob"></div></div><button class="action enter" data-key="Enter">ENTER</button><button class="action back" data-key="Escape">MENU</button></div><script src="game-progress.js"></script><script src="frogger.js"></script><script>const emit=(k,t)=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));let lastStep=0;function joystick(el){const knob=el.querySelector('.knob');let pid=null,lastDir=null;const reset=()=>{lastDir=null;knob.style.transform='translate(-50%,-50%)'};function move(e,force=false){const r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),mag=Math.hypot(dx,dy),max=r.width*.3,s=Math.min(1,max/(mag||1)),x=dx*s,y=dy*s;knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;if(mag<r.width*.11){reset();return}const k=Math.abs(dx)>Math.abs(dy)?(dx<0?'ArrowLeft':'ArrowRight'):(dy<0?'ArrowUp':'ArrowDown'),now=performance.now();if(force||k!==lastDir||now-lastStep>165){emit(k,'keydown');setTimeout(()=>emit(k,'keyup'),25);lastDir=k;lastStep=now}}el.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;el.setPointerCapture?.(pid);move(e,true)});el.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();move(e)}});['pointerup','pointercancel','lostpointercapture'].forEach(v=>el.addEventListener(v,e=>{if(pid===null||e.pointerId===pid){pid=null;reset()}}))}joystick(document.querySelector('#joy'));document.querySelectorAll('button[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();emit(k,'keydown');setTimeout(()=>emit(k,'keyup'),30)})});</script></body></html>
