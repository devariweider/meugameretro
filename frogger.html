<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Frogger — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#050505;font-family:monospace;touch-action:none}body{display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;aspect-ratio:4/3;image-rendering:pixelated;border:4px solid #222}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:clamp(120px,36vw,165px);aspect-ratio:1;border:3px solid #ffffff70;border-radius:50%;background:#0008;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#ddd;border:3px solid #fff;box-shadow:0 3px 10px #000b;pointer-events:none}.back{pointer-events:auto;position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));height:38px;border:2px solid #fff8;border-radius:8px;background:#000a;color:#fff;padding:0 12px;font:bold 11px monospace;touch-action:none}@media(pointer:coarse),(max-width:800px){body{align-items:flex-start}canvas{width:min(100vw,calc((100dvh - clamp(150px,40vw,195px))*1.333333));max-height:calc(100dvh - clamp(150px,40vw,195px));border-width:2px}.mobile{display:block}}@media(pointer:coarse) and (orientation:landscape){canvas{height:100dvh;width:auto;max-width:72vw;max-height:100dvh}.joy{left:auto;right:max(18px,env(safe-area-inset-right));transform:none;bottom:50%;translate:0 50%;width:min(29vh,150px)}}</style></head><body><canvas id="game" width="800" height="600"></canvas><div class="mobile"><div class="joy" id="joy"><div class="knob"></div></div><button class="back" data-key="Escape">MENU</button></div><script src="game-progress.js"></script><script src="frogger.js"></script><script>const emit=(k,t)=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));function joystick(el){const knob=el.querySelector('.knob');let active=null,current=null;function release(){if(current)emit(current,'keyup');current=null;knob.style.transform='translate(-50%,-50%)'}function move(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.29,d=Math.hypot(dx,dy)||1,s=Math.min(1,max/d),x=dx*s,y=dy*s;knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;if(Math.hypot(dx,dy)<r.width*.12){if(current){emit(current,'keyup');current=null}return}const k=Math.abs(dx)>Math.abs(dy)?(dx<0?'ArrowLeft':'ArrowRight'):(dy<0?'ArrowUp':'ArrowDown');if(k!==current){if(current)emit(current,'keyup');current=k;emit(k,'keydown')}}el.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;el.setPointerCapture?.(active);move(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});['pointerup','pointercancel'].forEach(v=>el.addEventListener(v,e=>{if(e.pointerId===active){active=null;release()}}))}joystick(document.querySelector('#joy'));document.querySelector('.back').addEventListener('pointerdown',e=>{e.preventDefault();emit('Escape','keydown')});</script></body></html>
