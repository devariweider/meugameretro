<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Frogger — Meu Game Retrô</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:monospace;touch-action:none}body{display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 1.333333));height:auto;max-height:100vh;aspect-ratio:4/3;image-rendering:pixelated;border:4px solid #222}.mobile{display:none;position:fixed;inset:0;pointer-events:none}.mobile button{pointer-events:auto;position:absolute;width:62px;height:62px;border:2px solid #fff8;border-radius:14px;background:#0009;color:#fff;font:bold 24px monospace;touch-action:none;user-select:none}.up{left:82px;bottom:102px}.left{left:18px;bottom:38px}.down{left:82px;bottom:38px}.right{left:146px;bottom:38px}.back{left:12px;top:max(12px,env(safe-area-inset-top));width:auto!important;height:40px!important;padding:0 12px;font-size:12px!important}@media(pointer:coarse),(max-width:700px){body{align-items:start}canvas{width:100vw;max-height:72vh;border-width:2px}.mobile{display:block}}</style></head><body><canvas id="game" width="800" height="600"></canvas><div class="mobile"><button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button><button class="back" data-key="Escape">MENU</button></div><script src="game-progress.js"></script><script src="frogger.js"></script><script>document.querySelectorAll('.mobile button').forEach(b=>{const k=b.dataset.key,send=t=>dispatchEvent(new KeyboardEvent(t,{code:k,key:k,bubbles:true}));b.addEventListener('pointerdown',e=>{e.preventDefault();send('keydown')});b.addEventListener('pointerup',e=>{e.preventDefault();send('keyup')})});</script></body></html>
